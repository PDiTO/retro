[project]
name = "retro"
version = "0.1.0"
description = "Mine your coding-agent sessions for mistakes, turn each one into a regression case, and hill-climb your skills and prompts against them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Paul Davis" }]
requires-python = ">=3.11"
keywords = ["llm", "agents", "evals", "claude-code", "codex", "prompt-optimization"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "rich>=13.7",
]

[project.scripts]
retro = "retro.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retro"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "RET", "TID", "PL",
]
ignore = [
    "PLR0911", # too many return statements: record-type dispatch reads better flat
    "PLR0912", # too many branches: same
    "PLR0913", # too many arguments: constructors take keyword config
    "PLR2004", # magic values in comparisons are fine in tests
    "PLR0915", # too many statements: same as branches, the record parsers are one flat loop
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=retro --cov-report=term-missing"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["retro"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
